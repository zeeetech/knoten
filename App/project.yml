name: Knoten

options:
  bundleIdPrefix: io.zeetech
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KnotenCore:
    path: ../KnotenCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Knoten:
    type: application
    platform: iOS
    sources:
      - path: Sources/Knoten
    dependencies:
      - package: KnotenCore
    info:
      path: Sources/Knoten/Info.plist
      properties:
        CFBundleDisplayName: Knoten
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: io.zeetech.knoten.oauth
            CFBundleURLSchemes:
              - app.knoten
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zeetech.knoten
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Knoten:
    build:
      targets:
        Knoten: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Knoten.storekit
